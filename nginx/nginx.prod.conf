events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # WebSocket upgrade mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Accept large form payloads (app.js also sets 50mb body-parser limit)
    client_max_body_size 50m;

    # Compress text-like responses. /data returns ~1.8 MB of JSON which
    # gzips to ~200 KB — biggest single perf win for the platform.
    # gzip_proxied any is required because nginx sits in front of the
    # orchestrator and would skip compression on proxied responses otherwise.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        application/json
        application/javascript
        application/xml
        application/x-yaml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # -----------------------------------------------------------------
    # Single server block. TLS is terminated upstream at the
    # paleopresto.com reverse proxy and forwarded to 127.0.0.1:9025 → :81.
    # -----------------------------------------------------------------
    server {
        listen 81;
        server_name custom.paleopresto.com _;

        # Trust X-Forwarded-For / X-Forwarded-Proto from the upstream proxy.
        # Replace the CIDR below with the actual university-proxy IP/subnet
        # so Express sees real client IPs and honors the HTTPS protocol.
        set_real_ip_from 127.0.0.1;
        # set_real_ip_from <UPSTREAM_PROXY_CIDR>;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        # -------- Blue Marble / Natural Earth tile proxy --------
        # Browser fetches /tiles_bluemarble/... from same origin; we proxy
        # to the tile-server container on the presto-network.
        location ~ ^/(tiles_bluemarble|tiles_bluemarble_3031|tiles_bluemarble_3995|tiles_bluemarble_3857|tiles_naturalearth_mollweide|tiles_naturalearth_3031|tiles_naturalearth_3995|tiles_naturalearth_3857)/ {
            proxy_pass http://tile-server:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_cache_valid 200 1y;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # -------- Server-Sent Events (must disable buffering) --------
        location /datacleaning/analyze-stream {
            proxy_pass http://presto-orchestrator:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;

            proxy_read_timeout 3600s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 3600s;
        }

        # -------- Everything else → Node orchestrator --------
        location / {
            proxy_pass http://presto-orchestrator:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Forward the upstream proxy's X-Forwarded-Proto so Express sees HTTPS
            # and issues Secure cookies. Falls back to $scheme for direct hits.
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_cache_bypass $http_upgrade;

            proxy_read_timeout 3600s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
