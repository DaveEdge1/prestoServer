events {
    worker_connections 1024;
}

http {
    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Default server for port 80
    server {
        listen 80;
        server_name _;

        location / {
            return 301 http://$host:81$request_uri;
        }
    }

    # Port 81 → prestoServer (presto-orchestrator)
    server {
        listen 81;
        server_name _;

        # Blue Marble / Natural Earth tile proxy — keeps mapManager.js on
        # same-origin relative URLs that work in both dev and prod.
        location ~ ^/(tiles_bluemarble|tiles_bluemarble_3031|tiles_bluemarble_3995|tiles_bluemarble_3857|tiles_naturalearth_mollweide|tiles_naturalearth_3031|tiles_naturalearth_3995|tiles_naturalearth_3857)/ {
            proxy_pass http://tile-server:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # SSE endpoint — must disable buffering so progress events flow in real time
        location /datacleaning/analyze-stream {
            proxy_pass http://presto-orchestrator:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE-specific settings
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;

            proxy_read_timeout 3600s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 3600s;
        }

        location / {
            proxy_pass http://presto-orchestrator:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Long timeout for reconstruction jobs
            proxy_read_timeout 3600s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
        }
    }

    # Port 83 → downloadServer (placeholder - add when containerized)
    server {
        listen 83;
        server_name _;

        location / {
            # TODO: Update when download-server is containerized
            # proxy_pass http://download-server:3001;
            return 503 "Service not yet containerized";
        }
    }

    # Port 84 → formServer (placeholder - add when containerized)
    server {
        listen 84;
        server_name _;

        location / {
            # TODO: Update when form-server is containerized
            # proxy_pass http://form-server:3002;
            return 503 "Service not yet containerized";
        }
    }

    # Port 85 → editorServer (placeholder - add when containerized)
    server {
        listen 85;
        server_name _;

        location / {
            # TODO: Update when editor-server is containerized
            # proxy_pass http://editor-server:3004;
            return 503 "Service not yet containerized";
        }
    }

    # Port 90 → Rserver (placeholder - add when containerized)
    server {
        listen 90;
        server_name _;

        location / {
            # TODO: Update when rserver is containerized
            # proxy_pass http://rserver:3010;
            return 503 "Service not yet containerized";
        }
    }
}
