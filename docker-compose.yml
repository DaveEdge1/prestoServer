services:
  # ===========================================
  # ORCHESTRATOR (prestoServer + prestoGo.js)
  # Uses same-path mounting - no code changes needed!
  # ===========================================
  presto-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    environment:
      - NODE_ENV=production
      - PORT=3000
      # SMTP Configuration (REQUIRED)
      - SMTP_HOST=${SMTP_HOST:-smtp.zoho.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-no-reply@paleopresto.com}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM:-no-reply@paleopresto.com}
      # MySQL Configuration
      - MYSQL_HOST=mysql
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-lipdverse}
      # GitHub OAuth Configuration (OPTIONAL - Personal Repos)
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - GITHUB_CALLBACK_URL=${GITHUB_CALLBACK_URL:-http://143.198.98.66/oauth/github/callback}
      - GITHUB_DEFAULT_VISIBILITY=${GITHUB_DEFAULT_VISIBILITY:-public}
      # GitHub App Configuration (OPTIONAL - Anonymous/Centralized Repos)
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_APP_INSTALLATION_ID=${GITHUB_APP_INSTALLATION_ID}
      - GITHUB_APP_PRIVATE_KEY_PATH=${GITHUB_APP_PRIVATE_KEY_PATH}
      - GITHUB_APP_PRIVATE_KEY=${GITHUB_APP_PRIVATE_KEY}
      - GITHUB_APP_ORG=${GITHUB_APP_ORG:-presto-reconstructions}
      - GITHUB_APP_DISABLED=${GITHUB_APP_DISABLED:-false}
      # Security Configuration
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SESSION_SECRET=${SESSION_SECRET}
      # External Services
      - GRAPHDB_URL=${GRAPHDB_URL:-https://linkedearth.graphdb.mint.isi.edu}
      - BASE_URL=${BASE_URL:-http://143.198.98.66}
      # File Paths for Reconstruction
      - USER_RECONS_PATH=${USER_RECONS_PATH:-/root/presto/userRecons}
      - PRESTO_FORM_PATH=${PRESTO_FORM_PATH:-/root/presto/prestoForm}
      - PRESTO_BASE_PATH=${PRESTO_BASE_PATH:-/root/presto}
      - HOLOCENE_DA_PATH=${HOLOCENE_DA_PATH:-/root/holocene_da}
      - TEMP12K_PATH=${TEMP12K_PATH:-/root/temp12k-regional-composites}
    volumes:
      # Docker socket for sibling containers (prestoGo.js spawns containers)
      # On Windows: //var/run/docker.sock or use named pipe
      - /var/run/docker.sock:/var/run/docker.sock
      # Persistent data — survives container restarts and recreations
      - user-recons-data:/root/presto/userRecons
      # Source code mounts - changes take effect on container restart (no rebuild needed)
      - ./routes:/root/presto/routes
      - ./services:/root/presto/services
      - ./scripts:/root/presto/scripts
      - ./prestoForm:/root/presto/prestoForm
      - ./jsonEditor:/root/presto/jsonEditor
      - ./templates:/root/presto/templates
      - ./getLipds:/root/presto/getLipds
      - ./query:/root/presto/query
      - ./public:/root/presto/public
      - ./app.js:/root/presto/app.js
      # PRODUCTION ONLY (Linux server at /root/presto):
      # These mounts enable same-path strategy. Comment out for local dev.
      # - /root/presto:/root/presto
      # - /root/holocene_da:/root/holocene_da
      # - /root/temp12k-regional-composites:/root/temp12k-regional-composites
    init: true  # Prevents zombie processes when volume mounts hang
    # No port exposure needed - nginx proxies via port 81
    networks:
      - presto-network
    restart: unless-stopped
    # Mirror prod (docker-compose.prod.yml) so local load tests reproduce
    # the memory ceiling that crashed the production container.
    mem_limit: 400m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    depends_on:
      mysql:
        condition: service_healthy

  # ===========================================
  # PROXY ANALYSIS SERVICE (port 8090, internal only)
  # Detects duplicate proxy records for the Data Cleaning page.
  # Long-running FastAPI service — no host port exposed.
  # ===========================================
  proxy-analysis:
    build:
      context: ./getLipds/proxyAnalysis
    environment:
      - GRAPHDB_URL=${GRAPHDB_URL:-https://linkedearth.graphdb.mint.isi.edu}
      # Hardcoded to the mysql service hostname — .env's MYSQL_HOST is set to
      # "localhost" for host-side tools; inside the Docker network we always
      # reach MySQL via the compose service name.
      - MYSQL_HOST=mysql
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-lipdverse}
      - LIPD_CACHE_DIR=/cache/lipd
    volumes:
      # Disk-backed LiPD series cache — keeps container RSS flat and
      # survives restarts so previously-seen datasets stay warm.
      - lipd-cache-data:/cache/lipd
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - presto-network
    restart: unless-stopped
    mem_limit: 1400m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ===========================================
  # BLUE MARBLE TILE SERVER (port 8080)
  # Tiles live in ../customTiles/ (outside repo - large binary data)
  # ===========================================
  tile-server:
    build:
      context: ./tileserver
    ports:
      - "8080:8080"
    volumes:
      - ../customTiles/blueMarble/tiles_mollweide:/usr/share/nginx/html/tiles_bluemarble:ro
      - ../customTiles/blueMarble_3031/tiles:/usr/share/nginx/html/tiles_bluemarble_3031:ro
      - ../customTiles/blueMarble_3995/tiles:/usr/share/nginx/html/tiles_bluemarble_3995:ro
      - ../customTiles/blueMarble_3857/tiles:/usr/share/nginx/html/tiles_bluemarble_3857:ro
      - ../customTiles/naturalEarth_3857/tiles:/usr/share/nginx/html/tiles_naturalearth_3857:ro
      - ../customTiles/naturalEarth_mollweide/tiles:/usr/share/nginx/html/tiles_naturalearth_mollweide:ro
      - ../customTiles/naturalEarth_3031/tiles:/usr/share/nginx/html/tiles_naturalearth_3031:ro
      - ../customTiles/naturalEarth_3995/tiles:/usr/share/nginx/html/tiles_naturalearth_3995:ro
    networks:
      - presto-network
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ===========================================
  # DATABASE
  # ===========================================
  mysql:
    image: mysql:8.0
    command: ["--local-infile=1", "--innodb-buffer-pool-size=256M"]
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-lipdverse}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - presto-network
    restart: unless-stopped
    mem_limit: 700m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===========================================
  # NGINX REVERSE PROXY
  # ===========================================
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "81:81"
      - "83:83"
      - "84:84"
      - "85:85"
      - "90:90"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - presto-orchestrator
    networks:
      - presto-network
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ===========================================
  # MONITORING STACK (prometheus / grafana / cadvisor / node-exporter / loki / promtail)
  # All bound to 127.0.0.1 only — never expose Grafana on a public port.
  # SSH-tunnel (e.g. `ssh -L 3001:localhost:3001 prod`) to reach prod.
  # ===========================================
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - presto-network
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    networks:
      - presto-network
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    command:
      - '--housekeeping_interval=10s'
      - '--docker_only=true'
      - '--store_container_labels=false'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - presto-network
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/.+)($$|/)'
    volumes:
      - /:/host:ro,rslave
    networks:
      - presto-network
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  loki:
    image: grafana/loki:3.2.1
    command: ['-config.file=/etc/loki/loki-config.yml']
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - presto-network
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  promtail:
    image: grafana/promtail:3.2.1
    command: ['-config.file=/etc/promtail/promtail-config.yml']
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Mount docker container logs read-only so Promtail can tail the
      # json-file driver output of every container on this host.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - presto-network
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  mysql-data:
  user-recons-data:
  lipd-cache-data:
  prometheus-data:
  grafana-data:
  loki-data:

networks:
  presto-network:
    driver: bridge
