//regex helper
var regExp = /\(([^)]+)\)/;
//extract leaflet rectangle coords
function changeBoxCoord(){
	SW = regExp.exec(rect._bounds._southWest)[1]
	South = SW.split(',')[0]
	West = SW.split(',')[1]
	NE = regExp.exec(rect._bounds._northEast)[1]
	North = NE.split(',')[0]
	East = NE.split(',')[1]
	var newCoords = South + ', ' + West + ', ' + North + ', ' + East
	document.getElementById("boxCoord").innerHTML = newCoords
	return newCoords
}
//initiate leaflet rectangle
var rect = L.rectangle([[25, -110], [35, -90]], { draggable: true });
map.addLayer(rect);
rect.editing.enable();

//update leaflet rectangle
rect.on('edit', function() { changeBoxCoord(); });

function loadLatLon (x1){
	var x1 = x1.filter((arr, index, self) =>
    index === self.findIndex((t) => (t.geo_latitude === arr.geo_latitude && t.geo_longitude === arr.geo_longitude)))
	//console.log('loadLatLon input: ' + x1)
	//console.log('loadLatLon input: ' + JSON.stringify(x1))
	var geojson = {
    "name":"NewFeatureType",
    "type":"FeatureCollection",
    "features": [],
	};
  for (let i = 0; i < Object.values(x1).length; i++) {
    lat = Object.values(x1)[i].geo_latitude
    lon = Object.values(x1)[i].geo_longitude
    aType = Object.values(x1)[i].archiveType
    dName = Object.values(x1)[i].dataSetName
    //console.log('lat ' + i + ': ' + lat)
    geojson.features.push({ "type": "Feature","geometry": {"type": "Point","coordinates": []},"properties": {"archiveType": [], "dataSetName": []} });
    geojson.features[i].geometry.coordinates.push(lon,lat);
    geojson.features[i].properties.archiveType.push(aType);
    geojson.features[i].properties.dataSetName.push(dName);
  }

  document.getElementById("latlon").innerHTML = JSON.stringify(geojson)
	
  return(geojson)
}
