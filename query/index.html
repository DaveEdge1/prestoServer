<script>
//initiate leaflet map
var map = L.map('map').setView([0, 0], 1);
var tiles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
	minZoom: 1
}).addTo(map);
//regex helper
var regExp = /\(([^)]+)\)/;
//extract leaflet rectangle coords
function changeBoxCoord(){
	SW = regExp.exec(rect._bounds._southWest)[1]
	South = SW.split(',')[0]
	West = SW.split(',')[1]
	NE = regExp.exec(rect._bounds._northEast)[1]
	North = NE.split(',')[0]
	East = NE.split(',')[1]
	var newCoords = South + ', ' + West + ', ' + North + ', ' + East
	document.getElementById("boxCoord").innerHTML = newCoords
	return newCoords
}
//initiate leaflet rectangle
var rect = L.rectangle([[25, -110], [35, -90]], { draggable: true });
map.addLayer(rect);
rect.editing.enable();

//add layer for points
var layerGroup = L.layerGroup().addTo(map);

//update leaflet rectangle
rect.on('edit', function() { console.log(changeBoxCoord()); });
</script>
