<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Autocomplete Lipdverse Query</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
 <link rel="stylesheet" href="//code.jquery.com/ui/1.11.0/themes/smoothness/jquery-ui.css">
 <script src="archiveType.js"></script>
</head>
<body>
<h1>Archive Type</h1>
<script src="//code.jquery.com/jquery-1.10.2.js"></script>
<script src="//code.jquery.com/ui/1.11.0/jquery-ui.js"></script>
 <form id="queryParams" method="POST" action="/lipdVerse">
     <div id="project-label">Select search engines <b>(multiple)</b> (type "g" or "b" or "y" for a start):</div>
<input id="project">
<br>
Selected synonym:    
<input type="text" id="synonym" name="synonym">
<br>
Selected lipdName:    
<input type="hidden" id="lipdName" name="lipdName">   
      </div>
    <div class="button-submit">
<button style="height:50px; width:100px; font-size:20px" type="submit" class="btn btn-primary">Submit</button>
</div>
  </form>
<script>
var archiveType = [{"lipdName":"Borehole","synonym":"Borehole, borehole"},{"lipdName":"Coral","synonym":"Coral, coral"},{"lipdName":"FluvialSediment","synonym":"Creek, Fluvial, FluvialSediment, River, Stream, "},{"lipdName":"GlacierIce","synonym":"GlacierIce, ice cores"},{"lipdName":"GroundIce","synonym":"GroundIce, bulk ice"},{"lipdName":"LakeSediment","synonym":"Lagoon, Lake, Lake Sediment, LakeSediment, "},{"lipdName":"MarineSediment","synonym":"Marine, MarineSediment, Delta, Marine Sediment, Ocean, "},{"lipdName":"Midden","synonym":"Midden, "},{"lipdName":"MolluskShell","synonym":"MolluskShells, bivalve, MolluskShell"},{"lipdName":"Other","synonym":"Marl, Meadow, Archaeological, Coast, Farmland, Forest, Sediment, Spring, Valley, , Other"},{"lipdName":"Peat","synonym":"Wetland, Bog, Fen, Marsh, Mire, Peat, Swamp, peat"},{"lipdName":"Sclerosponge","synonym":"Sclerosponge, sclerosponge"},{"lipdName":"Shoreline","synonym":"LakeDeposit, LakeDeposits, Shoreline, lake levels"},{"lipdName":"Speleothem","synonym":"Cave, Speleothem, speleothems"},{"lipdName":"TerrestrialSediment","synonym":"Paleosol, Dune, Loess, TerrestrialSediment, Terrestrial Sediment, "},{"lipdName":"Wood","synonym":"Wood, tree ring, tree"}]
    
 $(function() {
function split( val ) {
return val.split( /,\s*/ );
}
function extractLast( term ) {
return split( term ).pop();
}
/*     
var projects = [
{
value: "yahoo",
label: "Yahoo !"
},
{
value: "bing",
label: "Bing"
},
{
value: "google",
label: "Google"
}
];
*/     
$( "#project" )
 // don't navigate away from the field on tab when selecting an item
.bind( "keydown", function( event ) {
if ( event.keyCode === $.ui.keyCode.TAB &&
$( this ).autocomplete( "instance" ).menu.active ) {
event.preventDefault();
}
})
.autocomplete({
minLength: 0,
source: function( request, response ) {
// delegate back to autocomplete, but extract the last term
response( $.ui.autocomplete.filter(
archiveType, extractLast( request.term ) ) );
},

//    source:projects,    
focus: function() {
// prevent value inserted on focus
return false;
},
select: function( event, ui ) {
var terms = split( this.value );
// remove the current input
terms.pop();
// add the selected item
terms.push( ui.item.lipdName );
// add placeholder to get the comma-and-space at the end
terms.push( "" );
this.value = terms.join( ", " );
    
    var selected_label = ui.item.synonym;
    var selected_value = ui.item.lipdName;
    
    var synonym = $('#synonym').val();
    var lipdName = $('#lipdName').val();
    
    if(synonym == "")
    {
        $('#synonym').val(selected_label);
        $('#lipdName').val(selected_value);
    }
    else    
    {
        $('#synonym').val(synonym+","+selected_label);
        $('#lipdName').val(lipdName+","+selected_value);
    }   
    
return false;
}
});

 });     

</script>
