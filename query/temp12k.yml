#==============================================
# SETTINGS for Temp12k LiPDverse Query
# Do not remove any keys
# options for keys:
#   Explanation: free text field (Provide context for this section if needed; "~" is equivalent to NULL)
#   hide: true OR false (make filter invisible to user; if true, defaultChoice will always be selected)
#   defaultChoice: [exampleChoice] (see options for each dropdown menu; value selected upon loading)
#   options: [optionA, optionB, optionC] or "All" (see options for each dropdown menu; possible selections presented to user)
#   offByDefault: true OR false (this filter turned off by default)
#   defaultBounds: [minLat, maxLat, minLon, maxLon] (possible range: -90,90,-180,180; default bounding box for spatial filter)
#   defaultRange: [min, max] (possible range: see ranges for each dual-range slider; preset toggle points for dual-range slider)
#   tooltip: free text field (Replace the help text in the tooltip popup; "~" is equivalent to NULL, leave unchanged)
#==============================================

Compilation Filter:
  Explanation: ~

  compilation: 
    hide: false
    defaultChoice: [Temp12k]
    options: [Temp12k, Pages2kTemperature]
    tooltip: Choose compilation(s) (Begin typing for suggestions)

Location Filters:
  Explanation: ~

  coordBox: 
    hide: false
    offByDefault: true
    defaultBounds: [-90,90,-180,180]
    tooltip: Provide bounds to assimilate only proxies in a given region
    
  continent: 
    hide: false
    defaultChoice: ~
    options: All
    tooltip: Choose continent(s) (Begin typing for suggestions)

  country: 
    hide: false
    defaultChoice: ~
    options: All
    tooltip: Choose country(ies) (Begin typing for suggestions)

  terrestrial: 
    hide: false
    offByDefault: true
    defaultSelection: Terrestrial
    tooltip: Select only terrestrial/marine data

Material and Interpretation Filters:
  Explanation: ~

  seasonality:
    hide1: false
    defaultChoice1: annual,summerOnly,winterOnly
    options: All
    tooltip1: Choose seasonality(ies) (Begin typing for suggestions)
    hide2: false
    offByDefault2: true
    defaultRange2: [1,12]
    tooltip2: Span limited to 12 months. The outter months defined here will be included, but seasonality spans that extend outside the defined range will not. eg. Jun-Aug includes Jun,Jun-Jul,Jun-Aug,Jul,Jul-Aug,Aug

  archive:
    hide: false
    defaultChoice: ~
    options: All
    tooltip: Choose archive type(s) (Begin typing for suggestions)

  variable:
    hide: false
    defaultChoice: ~
    options: All
    tooltip: Choose variable name(s) (Begin typing for suggestions)

  proxy:
    hide: false
    defaultChoice: ~
    options: All
    tooltip: Choose proxy(ies) (Begin typing for suggestions)

Temporal Filters:
  Explanation: ~

  interval:
      hide: false
      offByDefault: true
      defaultRange: [100,600]
      tooltip: Choose the time period for which data will be required (years BP)
  
  resolution:
      hide: false
      offByDefault: true
      defaultValue: 200
      tooltip: Time series resolution must be better than this value (median value, in years)

