<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.0.3/dist/leaflet.css" />
    <style>
      #map {
        bottom: 0;
        left: 0;
        position: absolute;
        right: 0;
        top: 0;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script src="https://unpkg.com/browse/whatwg-fetch@3.2.0/dist/fetch.umd.js"></script>
    <script src="https://unpkg.com/leaflet@1.0.3/dist/leaflet.js"></script>
    <script src="https://unpkg.com/proj4"></script>
    <script src="https://unpkg.com/proj4leaflet@1.0.2"></script>
    <script src="https://unpkg.com/georaster"></script>
    <script src="https://unpkg.com/georaster-layer-for-leaflet"></script>
    <script src="https://unpkg.com/georaster-layer-for-leaflet"></script>
    <script>
    	// set CRS

      const resolutions = [
        0, 
        78271.484, 
        33072.982812632297,
        16536.491406316149,
        8268.2457031580743,
        4134.1228515790372,
        2067.0614257895186,
        1033.5307128947593,
        516.76535644737965,
        258.38267822368982,
        129.19133911184491,
        64.595669555922456,
        32.297834777961228,
        16.148917388980614]

    const crs = new L.Proj.CRS({
      resolutions: resolutions
    })
    
      // initalize leaflet map
      var map = L.map("map", {
      crs,
      center: [0,0],
      zoom: 3,
      minZoom: 2,
      maxZoom: 10,
      })

      // add Base Map
      var tiles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

			//var scale = chroma.scale('Spectral').domain([-19, -2340]);
      console.log("log test")
      
  fetch('/jan_ice_concentration3857.tif')
  .then(response => response.arrayBuffer())
  .then(arrayBuffer => {
    console.log('fetching geotiff')
    parseGeoraster(arrayBuffer).then(georaster => {
      console.log("georaster: ", georaster)
      var iceCo = new GeoRasterLayer({
          georaster: georaster,
          opacity: 0.4,
          //pixelValuesToColorFn: vals => vals[0] <= 0 ? null : '#' + rainbow.colourAt(Math.round(vals[0])),
          //resolution: 64, // optional parameter for adjusting display resolution
      }).addTo(map);
      map.fitBounds(iceCo.getBounds());
      });
      });


    </script>
  </body>
</html>
