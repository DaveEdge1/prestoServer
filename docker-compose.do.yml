# Production compose file for the Digital Ocean droplet (143.198.98.66).
#
# Differences from docker-compose.prod.yml (university Podman host):
#   - Mounts the Docker socket at /var/run/docker.sock (not the rootless
#     Podman socket under $XDG_RUNTIME_DIR).
#   - Binds nginx to 0.0.0.0:80 directly (no upstream TLS proxy).
#   - Drops the :z SELinux relabel suffixes on bind mounts (not used on
#     Ubuntu / Debian droplets).
#
# All custom images are pulled from Docker Hub (not built on the droplet).
# Build/push them from a dev machine with scripts/build-and-push.sh.
#
# Usage on the droplet (in ~/presto):
#   docker compose -f docker-compose.do.yml pull
#   docker compose -f docker-compose.do.yml up -d
#
# Requirements on the droplet (all under ~/presto/):
#   - .env.production (chmod 600) next to this compose file
#   - customTiles/ subdir populated via rsync (data only; not in any image)
#   - Docker Engine + docker-compose-plugin installed
#   - Deploy user in the docker group
#
# Traffic path:
#   http://143.198.98.66:84/
#     → nginx container :84 (published from :81 inside)
#     → presto-orchestrator:3000  or  tile-server:8080 (for /tiles_*)

services:
  presto-orchestrator:
    image: docker.io/davidedge/presto-orchestrator:latest
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MYSQL_HOST=mysql
      - USER_RECONS_PATH=/root/presto/userRecons
      - PRESTO_FORM_PATH=/root/presto/prestoForm
      - PRESTO_BASE_PATH=/root/presto
      - HOLOCENE_DA_PATH=/root/holocene_da
      - TEMP12K_PATH=/root/temp12k-regional-composites
    volumes:
      # Docker socket — orchestrator spawns sibling reconstruction containers.
      # Grants root-equivalent host access; acceptable single-tenant only.
      - /var/run/docker.sock:/var/run/docker.sock
      - user-recons-data:/root/presto/userRecons
    init: true
    networks:
      - presto-network
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  proxy-analysis:
    image: docker.io/davidedge/presto-proxy-analysis:latest
    env_file:
      - .env.production
    environment:
      - LIPD_CACHE_DIR=/cache/lipd
    volumes:
      # Disk-backed LiPD series cache — keeps container RSS flat and
      # survives restarts so previously-seen datasets stay warm.
      - lipd-cache-data:/cache/lipd
    networks:
      - presto-network
    restart: unless-stopped

  tile-server:
    image: docker.io/davidedge/presto-tile-server:latest
    volumes:
      - ./customTiles/blueMarble/tiles_mollweide:/usr/share/nginx/html/tiles_bluemarble:ro
      - ./customTiles/blueMarble_3031/tiles:/usr/share/nginx/html/tiles_bluemarble_3031:ro
      - ./customTiles/blueMarble_3995/tiles:/usr/share/nginx/html/tiles_bluemarble_3995:ro
      - ./customTiles/blueMarble_3857/tiles:/usr/share/nginx/html/tiles_bluemarble_3857:ro
      - ./customTiles/naturalEarth_3857/tiles:/usr/share/nginx/html/tiles_naturalearth_3857:ro
      - ./customTiles/naturalEarth_mollweide/tiles:/usr/share/nginx/html/tiles_naturalearth_mollweide:ro
      - ./customTiles/naturalEarth_3031/tiles:/usr/share/nginx/html/tiles_naturalearth_3031:ro
      - ./customTiles/naturalEarth_3995/tiles:/usr/share/nginx/html/tiles_naturalearth_3995:ro
    networks:
      - presto-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mysql:
    image: docker.io/library/mysql:8.0
    command: ["--local-infile=1", "--innodb-buffer-pool-size=256M"]
    env_file:
      - .env.production
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - presto-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: docker.io/davidedge/presto-nginx:latest
    # Edge of the deployment — listens on droplet's public :84.
    ports:
      - "84:81"
    depends_on:
      - presto-orchestrator
      - tile-server
    networks:
      - presto-network
    restart: unless-stopped

  # ===========================================
  # MONITORING STACK (DO droplet variant)
  # ===========================================
  # Standard Docker on Ubuntu, so cadvisor + node-exporter both work
  # (unlike the rootless Podman variant in docker-compose.prod.yml).
  #
  # Bindings: Grafana 127.0.0.1:3001, Prometheus 127.0.0.1:9090. The
  # droplet is internet-facing (nginx on :84), so the monitoring UIs
  # MUST stay on loopback only. Reach them via SSH tunnel:
  #
  #   ssh -L 3001:localhost:3001 -L 9090:localhost:9090 root@143.198.98.66
  #
  # Memory footprint: ~1.5 GB total for the four core services + ~400 MB
  # for cadvisor/node-exporter. Check `free -h` on the droplet before
  # bringing this stack up.

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - presto-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    env_file:
      - .env.production
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    networks:
      - presto-network
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    command:
      - '--housekeeping_interval=10s'
      - '--docker_only=true'
      - '--store_container_labels=false'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - presto-network
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/.+)($$|/)'
    volumes:
      - /:/host:ro,rslave
    networks:
      - presto-network
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.1
    command: ['-config.file=/etc/loki/loki-config.yml']
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - presto-network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.2.1
    command: ['-config.file=/etc/promtail/promtail-config.yml']
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - presto-network
    restart: unless-stopped

volumes:
  mysql-data:
  user-recons-data:
  lipd-cache-data:
  prometheus-data:
  grafana-data:
  loki-data:

networks:
  presto-network:
    driver: bridge
