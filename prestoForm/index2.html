<!DOCTYPE html>
<html lang="en">
  <head>
    <title>User Information</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
  </head>
  <body>
    <div class="container">
      <h1>Where should we send the results?</h1>
      <form action="/manualORdefault" method="POST">
        <div class="form-group">
          <label for="Name">Name</label>
          <input type="text" class="form-control" id="name" aria-describedby="emailHelp" placeholder="Enter your name" name="name">
        </div>
        <div class="form-group">
          <label for="Email">Email</label>
          <input type="text" class="form-control" id="useremail" aria-describedby="emailHelp" name="useremail" placeholder="Enter your email address (eg. John.Doe@vsmu.edu)">
        </div>
	<div class="form-group" id="config">
	<label class="radio-inline"><input type="radio" name="optradio" value="2">Edit Configuration In Browser Window</label>
        <label class="radio-inline"><input type="radio" name="optradio" value="1">Upload Configuration File</label>
        <label class="radio-inline"><input type="radio" name="optradio" value="0" checked="true">Use Defaults</label>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
      </form>
  </body>
</html>
