# Tells Grafana to load any *.json dashboard found under /etc/grafana/dashboards.
apiVersion: 1

providers:
  - name: presto
    orgId: 1
    folder: Presto
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
